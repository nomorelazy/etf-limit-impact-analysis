[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-limit-impact-analysis"
version = "0.1.0"
description = "Post-trade price-limit exposure and cash-substitution attribution for ETF arbitrage"
requires-python = ">=3.10"
dependencies = ["pyarrow>=15", "matplotlib>=3.7", "tzdata; sys_platform == 'win32'"]

[project.scripts]
etf-limit-impact = "etf_limit_impact.cli:main"

[tool.setuptools.packages.find]
include = ["etf_limit_impact*"]
